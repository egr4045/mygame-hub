# CIVA *game* services — started on player entry and stopped when idle by the orchestrator.
# Reached via the shared `gamehub-net` network (gateway proxies /socket.io here; the orchestrator
# probes /metrics here). No host ports — only the gateway publishes a port. The game's own code
# (including whatever builds `civa-service:latest` here) lives in its own repo, not this one — see
# docs/DESIGN.md. Only the network name changed with the GAMEHUB platform rename.
name: civa-game

networks:
  gamehub-net:
    external: true

services:
  lobby:
    image: civa-service:latest
    command: ['pnpm', '--filter', '@civa/lobby', 'start']
    environment:
      LOBBY_PORT: '8082'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/civa-game/.env}
      JWT_ISSUER: gamehub
      NODE_ENV: production
    networks:
      - gamehub-net
    restart: unless-stopped
