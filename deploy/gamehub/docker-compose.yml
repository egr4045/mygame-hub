# GAMEHUB platform stack — always-on. The single launcher origin (web/gateway) fronts the SPA,
# shared auth, social (friends/presence), chat (DMs/groups), community (changelog/discussions), and
# the orchestrator; a game's own lobby is started on demand (deploy/civa-game — the game itself is
# still called CIVA; GAMEHUB is the platform around it). Deployed alongside the existing Leaders
# stack on this host without touching it.
#
#   docker network create gamehub-net      # once
#   cd deploy/gamehub && cp .env.example .env && set JWT_SECRET (+ AUTH_BOOTSTRAP_ADMIN_IDS once you
#   know your own accountId — log in once first, see .env.example)
#   bash build-images.sh && docker compose up -d
name: gamehub

# All service logs go to stdout (json-file driver). Cap them so container logs can't fill the host
# disk — 3×10 MB per service. Referenced as `logging: *default-logging` on every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

networks:
  gamehub-net:
    external: true

volumes:
  gamehub-postgres-data:
  # Durable chat image uploads (was ephemeral container fs — died on every redeploy). Also the
  # filesystem the disk monitor watches.
  gamehub-chat-uploads:

services:
  # Dedicated Postgres for GAMEHUB — isolated from Leaders' own Postgres (different network,
  # different container), so a schema mistake here can't touch Leaders' data.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civa
      POSTGRES_PASSWORD: civa
      POSTGRES_DB: civa
    volumes:
      - gamehub-postgres-data:/var/lib/postgresql/data
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging

  auth:
    image: gamehub-service:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: service
    command: ['pnpm', '--filter', '@mygame/auth', 'start']
    environment:
      AUTH_PORT: '8081'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/gamehub/.env}
      JWT_ISSUER: civa
      DATABASE_URL: postgres://civa:civa@postgres:5432/civa
      # One-time admin bootstrap — see deploy/gamehub/.env.example. Empty is fine (no admins yet).
      AUTH_BOOTSTRAP_ADMIN_IDS: ${AUTH_BOOTSTRAP_ADMIN_IDS:-}
      # Telegram: auth owns the single bot poller (account linking + the `admin` ops-alert
      # registration). Same token the chat disk-monitor uses to SEND — one token, one poller.
      TELEGRAM_BOT_TOKEN: ${OPS_ALERT_BOT_TOKEN:-}
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging

  social:
    image: gamehub-service:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: service
    command: ['pnpm', '--filter', '@mygame/social', 'start']
    environment:
      SOCIAL_PORT: '8083'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/gamehub/.env}
      JWT_ISSUER: civa
      CORS_ORIGIN: '*'
      DATABASE_URL: postgres://civa:civa@postgres:5432/civa
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging

  chat:
    image: gamehub-service:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: service
    command: ['pnpm', '--filter', '@mygame/chat', 'start']
    environment:
      CHAT_PORT: '8084'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/gamehub/.env}
      JWT_ISSUER: civa
      CORS_ORIGIN: '*'
      DATABASE_URL: postgres://civa:civa@postgres:5432/civa
      LIVEKIT_URL: "${LIVEKIT_URL:?set LIVEKIT_URL in deploy/gamehub/.env, e.g. wss://mygame-quiz.ru/gamehub-livekit}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in deploy/gamehub/.env}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/gamehub/.env}"
      # Image uploads live under this dir (mounted volume below) — 50 MB cap, 30-day message
      # retention, and the disk this filesystem sits on is what the ops monitor alerts on.
      CHAT_DATA_DIR: /data
      CHAT_UPLOAD_MAX_BYTES: ${CHAT_UPLOAD_MAX_BYTES:-52428800}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
      # Separate ops-alert Telegram bot (NOT the auth linking bot). Unset → alerting disabled.
      OPS_ALERT_BOT_TOKEN: ${OPS_ALERT_BOT_TOKEN:-}
      CHAT_DISK_ALERT_PCT: ${CHAT_DISK_ALERT_PCT:-15}
      CHAT_DISK_ALERT_MIN_GB: ${CHAT_DISK_ALERT_MIN_GB:-3}
      NODE_ENV: production
    volumes:
      - gamehub-chat-uploads:/data
    depends_on:
      - postgres
      - livekit
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging

  # GAMEHUB's own self-hosted LiveKit for chat voice/video — a separate instance from Leaders' own
  # (port 7881, do not touch), on different ports (see livekit.yaml + the RTC ports below). The
  # signaling port (7880) is internal-only, reached through `web`'s Caddyfile at /gamehub-livekit/*;
  # the RTC ports carry actual media and can't go through Caddy, so they're published directly —
  # verify they're free on the host (`ss -tulpn`) before the first deploy, don't assume the defaults.
  livekit:
    image: livekit/livekit-server:latest
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: ['--config', '/etc/livekit.yaml']
    environment:
      # Format "apikey: apisecret" (see deploy/gamehub/.env.example) — generate the secret with
      # `openssl rand -hex 32`; never devkey/secret here (that's the local-dev-only default).
      LIVEKIT_KEYS: "${LIVEKIT_KEYS:?set LIVEKIT_KEYS in deploy/gamehub/.env}"
    ports:
      # Verified free on 186.246.11.239 via `ss -tulpn` before deploying — Leaders' own LiveKit
      # already occupies tcp 7881 + the entire 50000-50200 udp range on this shared host.
      - '7883:7883' # rtc tcp — must match livekit.yaml's rtc.tcp_port exactly (LiveKit advertises it verbatim)
      - '51000-51100:51000-51100/udp' # rtc udp range — must match livekit.yaml's port_range_*
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging

  community:
    image: gamehub-service:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: service
    command: ['pnpm', '--filter', '@mygame/community', 'start']
    environment:
      COMMUNITY_PORT: '8085'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/gamehub/.env}
      JWT_ISSUER: civa
      CORS_ORIGIN: '*'
      DATABASE_URL: postgres://civa:civa@postgres:5432/civa
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging

  orchestrator:
    image: gamehub-orchestrator:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: orchestrator
    environment:
      ORCHESTRATOR_PORT: '8090'
      CIVA_GAME_DIR: /root/gamehub/deploy/civa-game
      CIVA_GAME_PROJECT: civa-game
      CIVA_ACTIVITY_URL: http://lobby:8082/metrics
      CIVA_IDLE_MS: '600000' # stop the game after 10 min with zero players
      SVOYAK_GAME_DIR: /root/gamehub/deploy/svoyak
      SVOYAK_GAME_PROJECT: svoyak
      SVOYAK_ACTIVITY_URL: http://svoyak:8089/metrics
      SVOYAK_IDLE_MS: '600000'
      # Spellforge (cards) — its own repo, cloned to /root/cards on the host.
      CARDS_GAME_DIR: /root/cards/deploy
      CARDS_GAME_PROJECT: cards-game
      CARDS_ACTIVITY_URL: http://cards-server:8091/metrics
      CARDS_IDLE_MS: '600000'
      REAPER_MS: '30000'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/gamehub/.env}
      JWT_ISSUER: civa
      # Read-only: checks the shared accounts.is_admin flag for apps/admin's force-stop route (the
      # orchestrator's first-ever Postgres touch). Unset would 501 that one route; every other route
      # (GET /games, POST /:id/enter) stays exactly as public as before either way.
      DATABASE_URL: postgres://civa:civa@postgres:5432/civa
      NODE_ENV: production
    volumes:
      # Control the host Docker (start/stop the game compose). Mount the repo at the SAME path so
      # the compose file path is valid for the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/gamehub:/root/gamehub
      # Same-path mount rule as above — the cards compose file must resolve for the host daemon.
      - /root/cards:/root/cards
    depends_on:
      - postgres
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging

  web:
    image: gamehub-web:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
    ports:
      - '8088:8088'
    networks:
      - gamehub-net
    depends_on:
      - auth
      - social
      - chat
      - community
      - orchestrator
      - examplegame
      - admin
      - livekit
    restart: unless-stopped
    logging: *default-logging

  # SDK starter template — path-routed under the hub's own origin (web's Caddyfile strips
  # /example-game/ before proxying here), not its own port: same-origin means a browser's
  # http->https auto-upgrade can't break the navigation the way it does for a ported game, and the
  # SDK's own sameOrigin default already finds auth/social/chat/community with no URL to bake in.
  # No host port published — VITE_BASE_PATH bakes in asset URLs that assume the /example-game/
  # prefix, so direct-by-port access wouldn't serve them correctly anyway.
  examplegame:
    image: gamehub-examplegame:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: exampleweb
      args:
        VITE_BASE_PATH: /example-game/
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging

  # Minimal admin panel — path-routed under the hub's own origin (web's Caddyfile strips /admin/
  # before proxying here), same reasoning as examplegame above. Never shipped in the player-facing
  # hub bundle. Auth is the same passwordless login every player uses; access is a server-side
  # isAdmin check on every admin route (see AUTH_BOOTSTRAP_ADMIN_IDS on the auth service above).
  admin:
    image: gamehub-admin:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: adminweb
      args:
        VITE_BASE_PATH: /admin/
    networks:
      - gamehub-net
    restart: unless-stopped
    logging: *default-logging
