# svoyak — on-demand game (own SPA + auth). Started/stopped by the orchestrator. No published host
# ports: the gateway (deploy/gamehub) reaches svoyak:8089 over the shared gamehub-net network and
# serves the SPA under /svoyak/ on the hub HTTPS origin — mic/cam need that secure context, so a
# plain http://:8089 origin is not a usable path anyway. The orchestrator probes /metrics the same way.
name: svoyak

networks:
  gamehub-net:
    external: true

services:
  svoyak:
    image: svoyak:latest
    mem_limit: 512m
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: '8089'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/svoyak/.env}
      NODE_ENV: production
    networks:
      - gamehub-net
    restart: unless-stopped
